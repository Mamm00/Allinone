name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require and validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 scripts/prepare-signing.py
          keytool -exportcert -keystore app/release.keystore -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/signing-cert.der"
          echo "EXPECTED_SIGNER_SHA256=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "::notice::All four signing secrets are present; keystore password and alias validated."

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --list_installed || true
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;36.0.0" 2>&1 | tee /tmp/sdk-setup.log
          # Gradle installs the compile SDK it requires using the accepted licenses.
          sdkmanager --list_installed || true
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Retrieve original signed release for identity and upgrade checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline-release
          gh release download v1.0.1 --pattern 'HyperLauncherAI-*-release.apk' --dir baseline-release
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          for flavor in offline network; do
            report=$(apksigner verify --print-certs "baseline-release/HyperLauncherAI-$flavor-release.apk")
            original=$(printf '%s\n' "$report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "${original,,}" = "${EXPECTED_SIGNER_SHA256,,}" || { echo '::error::Signing key differs from v1.0.1; refusing incompatible update'; exit 1; }
          done

      - name: Lint
        run: ./gradlew :app:lintOfflineRelease :app:lintNetworkRelease --stacktrace || ./gradlew :app:lint --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testOfflineDebugUnitTest :app:testNetworkDebugUnitTest :feature-feed:test :feature-import:test --stacktrace

      - name: Build release APKs
        run: ./gradlew :app:assembleOfflineRelease :app:assembleNetworkRelease --stacktrace

      - name: Verify signed APKs before distribution
        run: bash scripts/verify-release.sh

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify signed upgrade, HOME and launch on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/test-signed-release.sh

      - name: Upload verified signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperLauncherAI-signed-release
          path: release-apks/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          target_commitish: ${{ github.sha }}
          name: HyperLauncher AI ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          body: |
            Smart categorized drawer, editable home/widget stacks, paged dock, smart search,
            optional gestures, wallpaper-sampled glass, explicit-refresh feed and weather,
            adaptive display/orientation layouts, Nova XML/native backup preview,
            PIN-hidden apps, searchable preferences, fonts and icon packs.

            Both editions use the existing permanent signing identity. Signature, alignment,
            permissions, v1.0.1 upgrade, HOME and launch/recreation checks run before publication.
            Offline has no INTERNET permission. Network requests require explicit feature actions.
            Google Play font downloads are separately disclosed, explicit brokered requests.

            Limitations: Nova proprietary/binary backups are unsupported. Rebind Android widgets
            and photo URI grants after restore; KWGT files require manual import. Hidden apps
            are launcher filtering, not an Android app lock or encrypted vault. Glass samples
            images selected/applied through this launcher, not arbitrary live-wallpaper pixels.
            Physical Redmi/foldable/external-display QA and startup/frame/RAM profiling are
            outstanding. OpenRouter certificate pinning is not configured (normal TLS applies).
            See KNOWN_LIMITATIONS.md and docs/RELEASE_1.1.0.md for scope and remaining manual QA.
            Download an APK or the APK ZIP, not GitHub's source ZIP. SHA256SUMS.txt covers both.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore key.properties "$RUNNER_TEMP/signing-cert.der"
