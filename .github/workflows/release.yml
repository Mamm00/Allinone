name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --list_installed || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "platforms;android-36" "platforms;android-34" "build-tools;37.0.0" "build-tools;36.0.0" "build-tools;34.0.0" "platform-tools"
          sdkmanager --list_installed || true
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify OpenRouter certificate pins (live TLS handshake)
        run: |
          echo "Fetching api.openrouter.ai certificate chain..."
          echo | openssl s_client -connect api.openrouter.ai:443 -servername api.openrouter.ai -showcerts 2>/dev/null > /tmp/or_tls.txt || true
          if [ ! -s /tmp/or_tls.txt ]; then
            echo "WARN: could not fetch live cert (network restricted). Pins must be verified manually before release."
          else
            echo "--- Cert subjects ---"
            grep -E "subject=|issuer=" /tmp/or_tls.txt | head -20
            echo "--- SPKI pins (base64) ---"
            # Extract leaf + intermediates and compute SPKI pins
            awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/' /tmp/or_tls.txt > /tmp/certs.pem
            if [ -s /tmp/certs.pem ]; then
              csplit -s -f /tmp/cert- /tmp/certs.pem '/BEGIN CERTIFICATE/' '{*}' 2>/dev/null || true
              for f in /tmp/cert-*; do
                [ -s "$f" ] || continue
                PIN=$(openssl x509 -in "$f" -pubkey -noout 2>/dev/null | openssl pkey -pubin -outform der 2>/dev/null | openssl dgst -sha256 -binary 2>/dev/null | openssl enc -base64 2>/dev/null | tr -d '\n')
                if [ -n "$PIN" ]; then echo "sha256/$PIN"; fi
              done
            fi
          fi

      - name: Require and validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 scripts/prepare-signing.py
          keytool -exportcert -keystore app/release.keystore -alias "$KEY_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -file "$RUNNER_TEMP/signing-cert.der"
          echo "EXPECTED_SIGNER_SHA256=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "::notice::All four signing secrets are present; keystore password and alias validated."

      - name: Lint
        run: ./gradlew :app:lintOfflineRelease :app:lintNetworkRelease --stacktrace || ./gradlew :app:lint --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testOfflineDebugUnitTest :app:testNetworkDebugUnitTest --stacktrace

      - name: Build release APKs
        run: ./gradlew :app:assembleOfflineRelease :app:assembleNetworkRelease --stacktrace

      - name: Verify signed APKs before distribution
        run: bash scripts/verify-release.sh

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify both signed APKs install on Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install --no-streaming release-apks/HyperLauncherAI-offline-release.apk
            adb install --no-streaming release-apks/HyperLauncherAI-network-release.apk
            adb shell pm path com.hyperlauncher.ai
            adb shell pm path com.hyperlauncher.ai.network
            echo "::notice::Both signed release APKs installed successfully on Android 14."

      - name: Upload verified signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: HyperLauncherAI-signed-release
          path: release-apks/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
          target_commitish: ${{ github.sha }}
          name: HyperLauncher AI ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.1' }}
          body: |
            Signed APKs fixing the invalid-package error in the unsigned v1.0.0 downloads.
            Both APK signatures and signer identity verified with apksigner, alignment checked,
            and both packages installed successfully on an Android 14 emulator before publication.
            Physical Redmi testing and app runtime/performance validation remain outstanding.
            The network flavor's OpenRouter certificate pins remain unconfigured; do not treat it as certificate-pinned.
            Download an APK below, not the source-code ZIP. SHA256SUMS.txt provides file checksums.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-apks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove signing material
        if: always()
        run: rm -f app/release.keystore key.properties "$RUNNER_TEMP/signing-cert.der"
