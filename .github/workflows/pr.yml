name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --list_installed || true
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          sdkmanager --list_installed || true
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Lint (offline debug)
        run: |
          ./gradlew :app:lintOfflineDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            echo "=== GRADLE FAILURE SUMMARY ==="
            grep -E "FAILED|error:|e: |What went wrong|Could not|Unresolved|Execution failed" /tmp/gradle.log | head -80 | while IFS= read -r line; do echo "::error::$line"; done
            echo "=== LAST 80 LINES ==="
            tail -80 /tmp/gradle.log | while IFS= read -r line; do echo "::error::$line"; done
            exit $STATUS
          fi
      - name: Upload gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
      - name: Unit tests (offline debug)
        run: ./gradlew :app:testOfflineDebugUnitTest --stacktrace
      - name: Assemble offline debug
        run: ./gradlew :app:assembleOfflineDebug --stacktrace
      - name: Assemble network debug
        run: ./gradlew :app:assembleNetworkDebug --stacktrace
      - name: Verify offline has no INTERNET permission
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          APK=$(find app/build/outputs/apk/offline/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          aapt dump permissions "$APK" | tee /tmp/perms.txt
          if grep -q "android.permission.INTERNET" /tmp/perms.txt; then
            echo "FAIL: offline APK must not declare INTERNET"
            exit 1
          fi
          echo "PASS: offline APK has no INTERNET permission"
      - name: Verify network has INTERNET permission
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          APK=$(find app/build/outputs/apk/network/debug -name "*.apk" | head -1)
          echo "APK: $APK"
          aapt dump permissions "$APK" | tee /tmp/perms2.txt
          if ! grep -q "android.permission.INTERNET" /tmp/perms2.txt; then
            echo "FAIL: network APK must declare INTERNET"
            exit 1
          fi
          echo "PASS: network APK declares INTERNET"
      - name: APK size gate (<25MB target, <30MB hard)
        run: |
          for APK in $(find app/build/outputs/apk -name "*.apk"); do
            SIZE=$(stat -c%s "$APK")
            echo "$APK: $SIZE bytes"
            if [ "$SIZE" -gt 31457280 ]; then
              echo "FAIL: $APK exceeds 30MB hard limit"
              exit 1
            fi
            if [ "$SIZE" -gt 26214400 ]; then
              echo "WARN: $APK exceeds 25MB target"
            fi
          done
